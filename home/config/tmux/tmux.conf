# Truecolor durchreichen (foot kann RGB, tmux muss es wissen)
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10          # sonst haengt ESC in TUIs wie Claude Code
set -g focus-events on

# Ctrl-b C = neue Claude-Session in eigenem Fenster
bind C new-window -c "#{pane_current_path}" claude
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Ctrl-b A = alle Fenster als Panes nebeneinander ins aktuelle Fenster holen.
# Ctrl-b B macht daraus wieder je ein eigenes Fenster, Ctrl-b T ordnet die
# zusammengeholten Panes als Raster an.
# run-shell expandiert selber Formate, darum ##{...} fuer das, was erst die
# innere tmux-Instanz sehen soll -- #{window_id} dagegen ist gewollt schon hier
# aufgeloest, das ist das Fenster, in dem die Taste gedrueckt wurde.
# list-windows/list-panes brauchen zwingend ein -t: ohne Ziel nehmen sie die
# zuletzt benutzte Session, nicht die eigene -- damit raeumt das Fenster sonst
# eine fremde Session leer. Als Ziel taugt nur #{window_id}: #{session_id} ist
# in diesem Format-Kontext leer (nur #{session_name} ist gesetzt) und
# $TMUX_PANE zeigt auf die Pane einer anderen Session. break-pane braucht aus
# demselben Grund ein Ziel, sonst landen die herausgeloesten Panes als Fenster
# in einer fremden Session; -a haengt sie hinter das Ursprungsfenster.
# Gemessen mit tmux 3.7c.
# Layout nach jedem Schritt neu setzen, sonst geht ab ein paar Fenstern der
# Platz fuer den naechsten Pane aus.
bind A run-shell 'tmux list-windows -t "#{window_id}" -F "##{window_id}" | grep -vx "#{window_id}" | while read w; do tmux join-pane -s "$w" -t "#{window_id}"; tmux select-layout -t "#{window_id}" even-horizontal; done'
bind B run-shell 'tmux list-panes -t "#{window_id}" -F "##{pane_id}" | tail -n +2 | while read p; do tmux break-pane -d -a -s "$p" -t "#{window_id}"; done'
bind T select-layout tiled

# Ctrl-b Leertaste schaltet die Ansicht im Kreis: nebeneinander -> Raster ->
# Tabs. Dieselbe Logik liegt in tmux-cycle-view, damit sie auch von aussen
# (Compositor-Taste) aufrufbar ist. C-F3 nur fuer den Fall, dass die Taste als
# echtes F3 durchs Terminal kommt -- die Mac-Sondertaste tut das nicht.
bind Space run-shell '~/.local/bin/tmux-cycle-view "#{window_id}"'
bind -n C-F3 run-shell '~/.local/bin/tmux-cycle-view "#{window_id}"'

# Statuszeile passend zu catppuccin-mocha
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left ""
set -g status-interval 5
set -g status-right-length 90
set -g status-right "#(~/.local/bin/tmux-status --loop 5) %H:%M "
setw -g window-status-current-style "bg=#89b4fa,fg=#1e1e2e,bold"
# Fenstername: Claude setzt per OSC einen Titel (pane_title); Shells lassen
# ihn auf dem Hostnamen stehen -> dann nur den Ordner zeigen, sonst Ordner
# plus Titel (ersetzt die Ordneranzeige der Claude-Statuszeile). Das "✳ ",
# das Claude jedem Titel voranstellt, fliegt raus.
#
# Die Tabs teilen sich den Platz links von der Statuszeile gleichmaessig auf,
# gerechnet im Format selbst: (client_width - 51) / Fensterzahl. Die 51 ist die
# feste Breite von status-right -- 44 Zeichen von tmux-status plus " HH:MM ".
# Nur die Slash-Form #{=/N/…:} nimmt eine gerechnete Breite an, #{=N:} und
# #{pN:} verlangen ein Literal. Darum erst mit #{p120:} grosszuegig auffuellen
# und dann auf die gerechnete Breite abschneiden: so ist jeder Tab exakt gleich
# breit, auch bei kurzen Namen. Die Fensternummer steht bewusst nicht drin,
# sie kostet nur Platz. Der Separator muss leer sein, sonst kaeme pro
# Tab eine Spalte dazu und die Rechnung ginge nicht auf.
setw -g window-status-separator ""
setw -g window-status-format         '#{=/#{e|/:#{e|-:#{client_width},51},#{session_windows}}/:#{p120: #{=/#{e|-:#{e|/:#{e|-:#{client_width},51},#{session_windows}},2}/…:#{?#{==:#{pane_title},#{host_short}},#{b:pane_current_path},#{b:pane_current_path}: #{s/^✳ //:pane_title}}} }}'
setw -g window-status-current-format '#{=/#{e|/:#{e|-:#{client_width},51},#{session_windows}}/:#{p120: #{=/#{e|-:#{e|/:#{e|-:#{client_width},51},#{session_windows}},2}/…:#{?#{==:#{pane_title},#{host_short}},#{b:pane_current_path},#{b:pane_current_path}: #{s/^✳ //:pane_title}}} }}'
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-style "fg=#45475a"


# Weiterschalten ohne Prefix. Ist mit Ctrl-b A alles in ein Fenster
# zusammengeholt, gibt es kein naechstes Fenster mehr -- dann schaltet die
# gleiche Taste stattdessen einen Pane weiter.
bind -n M-Tab if -F '#{==:#{session_windows},1}' 'select-pane -t :.+' 'next-window'
bind -n F3    if -F '#{==:#{session_windows},1}' 'select-pane -t :.+' 'next-window' 
# Ctrl-T = Terminal dazu. Ueber das Skript, damit es im zusammengeholten
# Zustand als Pane im Layout landet statt als Fenster daneben.
bind -n C-t run-shell '~/.local/bin/tmux-cycle-view --new "#{window_id}"'


# Blankes Bild-auf (Fn+Pfeil auf der MX Keys) springt in den Verlauf
bind -n PPage copy-mode -u

# Kopiertes landet direkt in der Wayland-Zwischenablage: tmux schickt es per
# OSC 52 an foot, foot an den Compositor -- damit kommt Ctrl+V in Chrome an.
set -s set-clipboard on
set -as terminal-features ",foot*:clipboard"
