# Kiosk terminal for the TTY boot (sway + foot --server). Adjust the font size here.
include=/usr/share/foot/themes/catppuccin-mocha

font=Cascadia Mono NF:size=11
font-bold=Cascadia Mono NF:weight=bold:size=11
dpi-aware=no
pad=12x0 center
login-shell=yes
title=Terminal

[scrollback]
lines=20000

[cursor]
style=beam
# No blinking: that would be a redraw every 500 ms, ten times more often than
# the status line -- foot, the compositor and the panel would never idle.
blink=no

[key-bindings]
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[mouse]
hide-when-typing=yes

# Neutral black background instead of Catppuccin's bluish 1e1e2e.
[colors-dark]
background=000000
