# Kiosk-Terminal fuer den TTY-Boot (cage -- foot). Schriftgroesse hier anpassen.
include=/usr/share/foot/themes/catppuccin-mocha

font=Cascadia Mono NF:size=11
font-bold=Cascadia Mono NF:weight=bold:size=11
dpi-aware=no
pad=12x0 center
login-shell=yes
title=Terminal

[scrollback]
lines=20000

[cursor]
style=beam
# Kein Blinken: das waere ein Neuzeichnen alle 500 ms und damit zehnmal
# haeufiger als die Statuszeile -- foot, cage und das Panel kaemen nie zur Ruhe.
blink=no

[key-bindings]
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[mouse]
hide-when-typing=yes

# Hintergrund neutral schwarz statt Catppuccins blaustichigem 1e1e2e.
[colors-dark]
background=000000
