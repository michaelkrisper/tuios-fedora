# Thunderbolt 2 controller — only the USB-A ports are used
blacklist thunderbolt

# Apple FaceTime HD Camera — already in blacklist-facetimehd.conf, listed for reference
# blacklist facetimehd

# Audio (both Intel HD Audio controllers) + internal microphone (Cirrus codec) — not needed
blacklist snd_hda_intel
blacklist snd_hda_codec_cs420x

# Bluetooth — in use (Logitech BT keyboard), power saving via btusb autosuspend
# blacklist btusb
# blacklist bluetooth
